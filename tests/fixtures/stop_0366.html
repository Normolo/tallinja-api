<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" http-equiv="refresh" content="60">
    <link href="/css/main.css" rel="stylesheet" type="text/css">
    <link href="/css/lines.css" rel="stylesheet" type="text/css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.1/jquery.min.js"></script>
    <title>My next bus</title>
</head>
<header>
  <div id="overlay_header" class="blur-in">
    <div class="toolbar" role="banner">
      <h1 class="title">My Next Bus</h1>
    </div>
  </div>
</header>
<body>
  <div id="overlay_body" class="cover blur-in">
    <div class="content" role="main">

      <div class="bus-list">

        <div class="station-item">
          <div class="station-icon">
            <i class="fas fa-bus"></i>
          </div>
          <div class="station-text">
            <h1 >Zejtun - 366</h1>
          </div>
        </div>
        <hr class="dashed">


          <div class="line-item">
            <div class="line_icon" id="l81">
              <p class="line-number">81</p>
            </div>
            <div class="line-name-container">
              <h2> Marsaxlokk - Valletta</h2>
              <h3 class="stopSubtitle"></h3>
            </div>
            <div class="line-time-container-active">
              <lord-icon
              src="https://cdn.lordicon.com/yzctygpq.json"
              trigger="loop"
              colors="primary:#66ee78,secondary:#66ee78"
              stroke="100"
              style="width:25px;height:25px; padding: 0%; margin: 0%;">
              </lord-icon>
              <h4> 9 min</h4>
              <h5>27 min</h5>
            </div>
          </div>
          <hr class="dashed">



      </div>

    </div>
  </div>
</body>
</html>

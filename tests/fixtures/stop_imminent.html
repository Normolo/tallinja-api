<!DOCTYPE html>
<!-- Real-world variant captured from stop 1090: an active (live) row whose time
     is shown as "< 2 min" (an imminent upper bound, not an exact value). -->
<html>
<head><meta charset="UTF-8" http-equiv="refresh" content="60"><title>My next bus</title></head>
<body>
  <div id="overlay_body" class="cover blur-in">
    <div class="content" role="main">
      <div class="bus-list">

        <div class="station-item">
          <div class="station-icon"><i class="fas fa-bus"></i></div>
          <div class="station-text">
            <h1 >Naxxar - 1090</h1>
          </div>
        </div>
        <hr class="dashed">

          <div class="line-item">
            <div class="line_icon" id="l202">
              <p class="line-number">202</p>
            </div>
            <div class="line-name-container">
              <h2> Sliema - Rabat</h2>
              <h3 class="stopSubtitle"></h3>
            </div>
            <div class="line-time-container-active">
              <lord-icon src="https://cdn.lordicon.com/yzctygpq.json" trigger="loop"></lord-icon>
              <h4> &lt; 2 min</h4>
              <h5>+30 min</h5>
            </div>
          </div>
          <hr class="dashed">

      </div>
    </div>
  </div>
</body>
</html>
